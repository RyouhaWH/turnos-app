name: Deploy to Server

# main = producción (amzoma.jorgewh.cl), beta = staging (beta-amzoma.jorgewh.cl)
# Los pull requests NO despliegan: solo corren tests (ver tests.yml).
on:
  push:
    branches: [ main, beta ]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        composer install --no-interaction --no-progress --prefer-dist
        npm ci

    - name: Build assets (los tests de páginas necesitan el manifest de Vite)
      run: npm run build

    - name: Run tests
      run: |
        cp .env.example .env
        php artisan key:generate
        ./vendor/bin/pest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: /tmp/composer-cache
        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-dev

    - name: Install NPM dependencies
      run: npm ci

    - name: Build React assets
      run: npm run build

    - name: Create deployment artifact
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: tar -czf "${GITHUB_SHA}".tar.gz --exclude=*.git --exclude=node_modules *

    - name: Store artifact for distribution
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: ${{ github.sha }}.tar.gz

    - name: Upload app to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        source: "${{ github.sha }}.tar.gz"
        target: "/tmp"

    - name: Extract, migrate and switch release
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            APP_PATH="/var/www/amzoma"
          else
            APP_PATH="/var/www/amzoma-beta"
          fi
          RELEASE="$APP_PATH/releases/${{ github.sha }}"

          mkdir -p "$RELEASE"
          mv /tmp/${{ github.sha }}.tar.gz "$RELEASE/"
          cd "$RELEASE"
          tar xzf ${{ github.sha }}.tar.gz
          rm -f ${{ github.sha }}.tar.gz

          # storage y .env compartidos por entorno (prod o beta)
          rm -rf "$RELEASE/storage"
          ln -nfs "$APP_PATH/storage" "$RELEASE/storage"
          ln -nfs "$APP_PATH/.env" "$RELEASE/.env"

          # --- Respaldo de la BD SQLite antes de migrar ---
          # La ruta real sale de DB_DATABASE en el .env del entorno.
          DB_FILE="$(grep -E '^DB_DATABASE=' "$APP_PATH/.env" | tail -1 | cut -d= -f2- | tr -d '"')"
          if [ -n "$DB_FILE" ] && [ -f "$DB_FILE" ]; then
            BACKUP_DIR="$APP_PATH/backups/db"
            mkdir -p "$BACKUP_DIR" && chmod 700 "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/predeploy-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}.sqlite"
            php -r '$p = new PDO("sqlite:" . $argv[1]); $p->exec("VACUUM INTO " . $p->quote($argv[2]));' "$DB_FILE" "$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            echo "[deploy] respaldo de BD: $BACKUP_FILE"
            # conservar solo los últimos 10 respaldos pre-deploy
            ls -t1 "$BACKUP_DIR"/predeploy-*.sqlite 2>/dev/null | tail -n +11 | xargs -r rm -f
          else
            echo "[deploy] ERROR: no se encontró la BD en '$DB_FILE'; se aborta el deploy" >&2
            exit 1
          fi

          # Si una migración falla, el deploy se detiene y la versión actual sigue activa
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan storage:link || true

          # Activar el nuevo release
          ln -nfs "$RELEASE" "$APP_PATH/current"
          sudo systemctl reload php8.3-fpm

          # Reiniciar workers de cola para que tomen el código nuevo (systemd los relanza)
          php artisan queue:restart || true

          # Limpiar releases viejas (mantener últimas 3)
          cd "$APP_PATH/releases" && ls -t1 | tail -n +4 | xargs -r rm -rf
